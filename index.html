<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Userscope and Sharing</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<style>
  /* ---------------------------------------------------------------
     Walkthrough shell tokens. Deliberately separate from the aiRA
     token set below, so a reviewer can always tell the harness from
     the product.
     --------------------------------------------------------------- */
  :root {
    /* This harness and the product inside it are a light-mode design. Saying so
       stops the host's scheme resolving UA system colours (buttontext) to white. */
    color-scheme: light;
    --wt-canvas: #F6F8FA;
    --wt-surface: #FFFFFF;
    --wt-border: #E2E6EB;
    --wt-ink: #111827;
    --wt-ink-2: #364152;
    --wt-ink-3: #6B7785;
    --wt-accent: #3438C9;
    --wt-accent-bg: #EEF0FF;
    --wt-danger: #B11E1E;
    --wt-danger-bg: #FBEAEA;
  }

  * { box-sizing: border-box; }
  html { background: var(--wt-canvas); }
  body {
    margin: 0;
    background: var(--wt-canvas);
    color: var(--wt-ink);
    font-family: "Roboto", system-ui, -apple-system, sans-serif;
    overflow-x: auto;
    overflow-y: hidden;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--wt-accent); outline-offset: 2px; }

  /* The app owns the whole window at 1:1 — nothing steals width from it, and
     nothing scales it, so type and spacing can be judged at real size. */
  html, body { height: 100%; }

  /* Prototype controls. Deliberately not product chrome: a dark strip at the
     bottom edge, carrying only the states you cannot reach by clicking. */
  .proto-bar {
    position: fixed; left: 50%; transform: translateX(-50%); top: 16px; z-index: 200;
    display: flex; align-items: center; gap: 6px;
    background: rgba(17, 24, 39, 0.94); border-radius: 999px; padding: 6px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.28);
    font-family: "Roboto", system-ui, sans-serif;
  }
  .proto-bar label {
    display: flex; align-items: center; gap: 6px; padding-left: 10px;
    font-size: 12px; line-height: 16px; color: rgba(255, 255, 255, 0.6);
  }
  .proto-bar select, .proto-bar button {
    appearance: none; border: none; border-radius: 999px;
    background: rgba(255, 255, 255, 0.12); color: #FFFFFF;
    font-family: inherit; font-size: 13px; line-height: 18px;
    padding: 6px 12px; cursor: pointer;
  }
  .proto-bar select:hover, .proto-bar button:hover { background: rgba(255, 255, 255, 0.2); }
  .proto-bar select:focus-visible, .proto-bar button:focus-visible {
    outline: 2px solid #8E97FF; outline-offset: 2px;
  }
  .proto-bar option { color: #111827; }

  /* ---------------------------------------------------------------
     Inside the stage: aiRA design system only.
     --------------------------------------------------------------- */
  #app {
    --aira-bg-elevated: #FFFFFF;
    --aira-bg-canvas: #F6F8FA;
    --aira-bg-subtle: #F6F8FA;
    --aira-bg-hover: #EEF1F4;
    --aira-bg-muted: #EEF1F4;
    --aira-bg-selected: #EEF0FF;
    --aira-border-subtle: #EEF1F4;
    --aira-border-default: #E2E6EB;
    --aira-border-strong: #C9D0D9;
    --aira-text-primary: #111827;
    --aira-text-secondary: #364152;
    --aira-text-tertiary: #6B7785;
    --aira-text-placeholder: #9AA4B2;
    --aira-text-link: #3438C9;
    --indigo-600: #3438C9;
    --indigo-500: #4A50EF;
    --indigo-50: #EEF0FF;
    --avatar-grad: linear-gradient(135deg, #6268FF 0%, #3BA7FF 100%);
    --green-600: #185C32;
    --green-50: #E9F7EE;
    --red-500: #B11E1E;
    --red-50: #FBEAEA;
    --red-border: #F3D0D0;
    --shadow-md: 0 8px 24px rgba(17, 24, 39, 0.12), 0 2px 6px rgba(17, 24, 39, 0.06);
    --shadow-lg: 0 20px 48px rgba(17, 24, 39, 0.20), 0 4px 12px rgba(17, 24, 39, 0.08);

    width: 100%; min-height: 100vh; position: relative;
    background: var(--aira-bg-canvas);
    color: var(--aira-text-primary);
    font-size: 14px; line-height: 20px;
  }
  #app button { cursor: pointer; }

  /* Dashboard behind the dialog */
  .dash-top {
    height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 32px;
    background: var(--aira-bg-elevated); border-bottom: 1px solid var(--aira-border-default);
  }
  .dash-wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
  .dash-crumb { font-size: 13px; color: var(--aira-text-tertiary); }
  .dash-body { padding: 32px; }
  .dash-titlerow { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .dash-title { font-size: 22px; line-height: 30px; font-weight: 600; margin: 0 0 2px 0; }
  .dash-sub { font-size: 13px; line-height: 18px; color: var(--aira-text-tertiary); }
  .dash-actions { display: flex; align-items: center; gap: 8px; }
  .dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .dash-card {
    background: var(--aira-bg-elevated); border: 1px solid var(--aira-border-default);
    border-radius: 8px; padding: 20px;
  }
  .dash-metric-label { font-size: 13px; line-height: 18px; color: var(--aira-text-tertiary); margin-bottom: 6px; }
  .dash-metric-value { font-size: 28px; line-height: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dash-chart-title { font-size: 16px; line-height: 24px; font-weight: 500; margin: 0 0 4px 0; }
  .dash-chart-sub { font-size: 13px; line-height: 18px; color: var(--aira-text-tertiary); margin-bottom: 20px; }
  .dash-bars { display: flex; align-items: flex-end; gap: 24px; height: 200px; padding-left: 8px; }
  .dash-bar-col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; height: 100%; }
  .dash-bar { background: #9AA4B2; border-radius: 3px 3px 0 0; }
  .dash-bar.lead { background: var(--indigo-600); }
  .dash-bar-label { font-size: 12px; line-height: 16px; color: var(--aira-text-tertiary); text-align: center; }
  .dash-sample { font-size: 12px; line-height: 16px; color: var(--aira-text-tertiary); margin-top: 16px; }

  .scrim {
    position: fixed; inset: 0; background: rgba(17, 24, 39, 0.45);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 96px;
  }

  /* Share dialog */
  .modal {
    width: 480px; background: var(--aira-bg-elevated); border-radius: 12px;
    box-shadow: var(--shadow-lg); border: 1px solid var(--aira-border-default);
    padding: 24px; position: relative;
  }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .modal-title { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--aira-text-primary); margin: 0; }
  .close-btn {
    width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--aira-text-secondary); flex-shrink: 0;
    /* Optical alignment: the glyph is centred in the hit area and the button
       itself shifts right, so the drawn X sits on the content edge below while
       the hover fill stays centred on it. Offset measured, not guessed. */
    margin-inline-end: -11px;
  }
  .close-btn:hover { background: var(--aira-bg-muted); color: var(--aira-text-primary); }
  .close-btn:active { background: var(--aira-bg-muted); }

  .search-field { position: relative; margin-bottom: 8px; }
  .field-hint {
    font-size: 13px; line-height: 20px; color: var(--aira-text-tertiary);
    margin: 0 0 24px 0;
  }
  .field-hint.with-suggestions { margin-bottom: 12px; }
  .search-input {
    width: 100%; height: 36px; border: 1px solid var(--aira-border-default); border-radius: 8px;
    padding: 0 12px 0 36px; font-family: inherit; font-size: 14px; line-height: 20px;
    color: var(--aira-text-primary); background: var(--aira-bg-elevated); outline: none;
  }
  .search-input:focus { border-color: var(--indigo-600); box-shadow: 0 0 0 3px var(--indigo-50); }
  .search-input::placeholder { color: var(--aira-text-placeholder); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--aira-text-tertiary); pointer-events: none; display: flex; }
  .search-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--aira-bg-elevated); border: 1px solid var(--aira-border-default);
    border-radius: 10px; box-shadow: var(--shadow-md); padding: 4px; z-index: 40;
    max-height: 280px; overflow-y: auto;
  }
  .search-result-row {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: none; background: transparent; border-radius: 8px; padding: 8px;
    color: var(--aira-text-primary);
  }
  .search-result-row:hover { background: var(--aira-bg-hover); }
  .search-result-row.taken { opacity: 0.55; cursor: default; }
  .search-result-row.taken:hover { background: transparent; }
  .has-access-flag { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 12px; line-height: 16px; color: var(--aira-text-tertiary); }

  .skel-row { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .skel-avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--aira-bg-hover); flex-shrink: 0; }
  .skel-lines { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; }
  .skel-line { height: 8px; border-radius: 4px; background: var(--aira-bg-hover); }
  .skel-line.short { width: 40%; }
  .skel-line.long { width: 72%; }

  .no-results { padding: 16px 12px; }
  .no-results-title { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary); margin: 0 0 4px 0; }
  .no-results-desc { font-size: 13px; line-height: 20px; color: var(--aira-text-tertiary); margin: 0; }

  .validation {
    display: flex; align-items: flex-start; gap: 8px;
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--aira-bg-elevated); border: 1px solid var(--red-border);
    border-radius: 10px; box-shadow: var(--shadow-md); padding: 12px; z-index: 40;
  }

  .chip-field {
    position: relative;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    border: 1px solid var(--aira-border-default); border-radius: 8px;
    padding: 4px 8px; min-height: 36px; margin-bottom: 8px;
    background: var(--aira-bg-elevated); cursor: text;
  }
  .chip-field:focus-within { border-color: var(--indigo-600); box-shadow: 0 0 0 3px var(--indigo-50); }
  .chip-input {
    flex: 1 1 140px; min-width: 140px; height: 28px; border: none; outline: none;
    background: transparent; font-family: inherit; font-size: 14px; line-height: 20px;
    color: var(--aira-text-primary); padding: 0;
  }
  .chip-input::placeholder { color: var(--aira-text-placeholder); }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; background: var(--aira-bg-hover);
    border-radius: 999px; padding: 4px 4px 4px 8px; font-size: 13px; line-height: 20px;
    color: var(--aira-text-primary);
  }
  .chip-x {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border: none; border-radius: 999px; padding: 0;
    background: transparent; color: var(--aira-text-secondary);
  }
  .chip-x:hover { background: var(--aira-bg-muted); color: var(--aira-text-primary); }
  .chip-more { font-size: 14px; line-height: 20px; color: var(--aira-text-tertiary); padding-left: 4px; }

  .suggest-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px 0; }
  .suggest-chip {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 8px;
    border: 1px solid var(--aira-border-default); border-radius: 999px;
    background: var(--aira-bg-elevated); font-size: 13px; line-height: 20px; color: var(--aira-text-primary);
  }
  .suggest-chip:hover { background: var(--aira-bg-hover); }
  .suggest-chip .plus { color: var(--aira-text-link); display: flex; }

  .banner {
    display: flex; align-items: flex-start; gap: 8px; background: var(--red-50);
    border: 1px solid var(--red-border); border-radius: 8px; padding: 12px;
    margin-bottom: 20px;
  }
  .banner-icon { color: var(--red-500); display: flex; flex-shrink: 0; margin-top: 1px; }
  .banner-text { display: flex; flex-direction: column; gap: 2px; }
  .banner-title { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary); }
  .banner-desc { font-size: 13px; line-height: 20px; color: var(--aira-text-secondary); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .section-label {
    font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--aira-text-tertiary); text-transform: uppercase; margin: 0 0 12px 0;
  }
  .section-head .section-label { margin: 0; }
  .count-tag { font-size: 13px; line-height: 20px; color: var(--aira-text-tertiary); }

  .people-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .people-list.scrolls {
    max-height: 180px; overflow-y: auto; overflow-x: hidden;
    padding: 0 8px; margin: 0 -8px;
  }
  .people-list.scrolls::-webkit-scrollbar { width: 6px; }
  .people-list.scrolls::-webkit-scrollbar-track { background: transparent; }
  .people-list.scrolls::-webkit-scrollbar-thumb { background: var(--aira-border-strong); border-radius: 999px; }
  .person-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-radius: 8px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 999px; background: var(--avatar-grad); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .person-info { flex: 1 1 auto; min-width: 0; }
  .person-name {
    font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person-email {
    font-size: 14px; line-height: 20px; color: var(--aira-text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .owner-label { font-size: 14px; line-height: 20px; color: var(--aira-text-tertiary); padding: 8px; flex-shrink: 0; }

  .list-error {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1px solid var(--aira-border-default); border-radius: 10px; padding: 24px 16px; margin-bottom: 8px;
  }
  .list-error-icon { color: var(--red-500); display: flex; margin-bottom: 4px; }
  .list-error-title { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary); }
  .list-error-desc { font-size: 13px; line-height: 20px; color: var(--aira-text-tertiary); margin-bottom: 12px; }

  .dd { position: relative; flex-shrink: 0; }
  .dd-trigger {
    display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 8px;
    border: 1px solid transparent; background: transparent; font-size: 14px; line-height: 20px;
    color: var(--aira-text-primary);
  }
  .dd-trigger:hover { background: var(--aira-bg-hover); }
  .dd-trigger.open { background: var(--aira-bg-hover); }
  .dd-trigger .chev { color: var(--aira-text-tertiary); display: flex; }
  .dd-menu.anchored { position: fixed; right: auto; top: auto; }
  .dd-menu {
    position: absolute; right: 0; top: calc(100% + 4px); width: 240px; background: var(--aira-bg-elevated);
    border: 1px solid var(--aira-border-default); border-radius: 10px; box-shadow: var(--shadow-md);
    padding: 4px; z-index: 40;
  }
  .dd-option {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; border: none;
    background: transparent; border-radius: 6px; padding: 8px;
    color: var(--aira-text-primary);
  }
  .dd-option:hover { background: var(--aira-bg-hover); }
  .dd-option .check {
    width: 16px; height: 20px; color: var(--indigo-600); flex-shrink: 0;
    display: flex; align-items: center;
  }
  .dd-option-text { display: flex; flex-direction: column; }
  .dd-option-label { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary); }
  .dd-option-sub { font-size: 13px; line-height: 20px; color: var(--aira-text-tertiary); }
  .dd-divider { height: 1px; background: var(--aira-border-default); margin: 4px; }

  .divider { height: 1px; background: var(--aira-border-default); margin: 20px 0; }
  .general-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .general-icon {
    width: 28px; height: 28px; border-radius: 999px; background: var(--aira-bg-muted);
    color: var(--aira-text-secondary); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .general-icon svg { width: 14px; height: 14px; }
  .general-dd { flex: 1 1 auto; position: relative; }
  .general-trigger {
    /* A control, so radius-md (8px) and the md button height — 999px is the
       pill radius, which belongs to pills and chips. */
    display: inline-flex; align-items: center; gap: 12px; height: 36px;
    padding: 0 12px 0 4px; margin-left: -4px; border-radius: 8px; border: none;
    background: transparent;
    font-size: 14px; line-height: 20px; font-weight: 500; color: var(--aira-text-primary);
  }
  .general-trigger:hover { background: var(--aira-bg-hover); }
  .general-trigger.open { background: var(--aira-bg-hover); }
  .general-trigger.static { padding: 0; margin-left: 0; height: 28px; gap: 0; color: var(--aira-text-secondary); cursor: default; }
  .general-trigger.static:hover { background: transparent; }
  .general-trigger .chev { color: var(--aira-text-tertiary); display: flex; flex-shrink: 0; }
  .general-menu {
    position: absolute; left: 0; width: 340px; top: calc(100% + 4px); background: var(--aira-bg-elevated);
    border: 1px solid var(--aira-border-default); border-radius: 10px; box-shadow: var(--shadow-md);
    padding: 4px; z-index: 40;
  }
  .general-desc { font-size: 14px; line-height: 20px; color: var(--aira-text-tertiary); text-align: left; margin: 8px 0 0 0; }

  .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
  .footer-actions { display: flex; align-items: center; gap: 8px; }

  /* Compose step */
  .modal-header.compose { align-items: center; justify-content: flex-start; gap: 12px; }
  .back-btn {
    width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--aira-text-secondary); flex-shrink: 0; margin-inline-start: -7px;
  }
  .back-btn:hover { background: var(--aira-bg-muted); color: var(--aira-text-primary); }
  .compose-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 16px; }
  .compose-row .chip-field { flex: 1 1 auto; margin-bottom: 0; }
  .dd-trigger.bordered {
    border: 1px solid var(--aira-border-default); background: var(--aira-bg-elevated);
    height: 36px; padding: 0 12px;
  }
  .dd-trigger.bordered:hover { border-color: var(--aira-border-strong); background: var(--aira-bg-elevated); }
  .dd-trigger.bordered.open { background: var(--aira-bg-hover); }
  .check-row { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px; }
  .check-row input { position: absolute; opacity: 0; width: 0; height: 0; }
  .check-row .box {
    width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
    border: 1px solid var(--aira-border-strong); background: var(--aira-bg-elevated);
    display: flex; align-items: center; justify-content: center; color: #FFFFFF;
  }
  .check-row input:checked + .box { background: var(--indigo-600); border-color: var(--indigo-600); }
  .check-row input:focus-visible + .box { outline: 2px solid var(--indigo-600); outline-offset: 2px; }
  .check-label { font-size: 14px; line-height: 20px; color: var(--aira-text-primary); }
  .caps { margin-bottom: 0; }
  .caps-head {
    font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--aira-text-tertiary); margin: 0 0 8px 0;
  }
  .cap-row { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; }
  .cap-row input { position: absolute; opacity: 0; width: 0; height: 0; }
  .cap-row .box {
    width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
    border: 1px solid var(--aira-border-strong); background: var(--aira-bg-elevated);
    display: flex; align-items: center; justify-content: center; color: #FFFFFF;
  }
  .cap-row input:checked + .box { background: var(--indigo-600); border-color: var(--indigo-600); }
  .cap-row input:focus-visible + .box { outline: 2px solid var(--indigo-600); outline-offset: 2px; }
  .cap-row.fixed { cursor: default; }
  .cap-row.fixed .box { background: var(--aira-border-strong); border-color: var(--aira-border-strong); }
  .cap-label { font-size: 14px; line-height: 20px; color: var(--aira-text-primary); }
  .cap-row.fixed .cap-label { color: var(--aira-text-secondary); }
  .message {
    display: block; width: 100%; margin-top: 0; padding: 12px; border-radius: 8px;
    border: 1px solid var(--aira-border-default); background: var(--aira-bg-elevated);
    font-family: inherit; font-size: 14px; line-height: 20px; color: var(--aira-text-primary);
    resize: vertical; outline: none;
  }

  // "Make owner" is owner-only: you cannot give away what you do not hold.
  function iAmOwner() {
    var me = personById(S.me);
    return !!me && me.role === 'owner';
  }
  function firstName(name) { return String(name).trim().split(/\s+/)[0]; }

  // ---------------------------------------------------------------
  // Render &mdash; the app is rebuilt from state on every change.
  // ---------------------------------------------------------------
  function renderDashboard() {
    var bars = [
      { label: 'Store 1', h: 58 },
      { label: 'Store 2', h: 71 },
      { label: 'Store 3', h: 44 },
      { label: 'Store 4', h: 96, lead: true },

      '</div>' +
      '<div class="dash-body">' +
        '<div class="dash-titlerow">' +
          '<div>' +
            '<h1 class="dash-title">July sales</h1>' +
            '<div class="dash-sub">Built by aiRA &middot; last run 6 Sep, 09:12</div>' +
          '</div>' +
          '<div class="dash-actions">' +
            '<button class="btn btn-secondary" type="button">Export</button>' +
            '<button class="btn btn-primary" type="button" data-act="open" data-live="Share">Share</button>' +
          '</div>' +
        '</div>' +
        '<div class="dash-grid">' +
          '<div class="dash-card"><div class="dash-metric-label">Net sales</div><div class="dash-metric-value">18.4L</div></div>' +
          '<div class="dash-card"><div class="dash-metric-label">Transactions</div><div class="dash-metric-value">7,204</div></div>' +
          '<div class="dash-card"><div class="dash-metric-label">Average bill</div><div class="dash-metric-value">2,554</div></div>' +
        '</div>' +
        '<div class="dash-card">' +
          '<h2 class="dash-chart-title">Store 4 leads sales this month</h2>' +
          '<div class="dash-chart-sub">Net sales by store, July</div>' +
          '<div class="dash-bars">' +
            bars.map(function (b) {
              return '<div class="dash-bar-col">' +

          '<div class="dash-sample">Sample data &mdash; the dashboard behind the dialog is context only.</div>' +
        '</div>' +
      '</div>';

  function renderResults() {
    if (S.results === 'loading') {
      var rows = '';
      for (var i = 0; i < 4; i++) {
        rows += '<div class="skel-row"><div class="skel-avatar"></div>' +
          '<div class="skel-lines"><div class="skel-line short"></div><div class="skel-line long"></div></div></div>';
      }
      return '<div class="search-results" aria-busy="true">' + rows + '</div>';
    }
    if (S.results === 'none') {
      return '<div class="search-results">' +
        '<div class="no-results">' +
          '<p class="no-results-title">No matches for &ldquo;' + esc(S.draft.trim()) + '&rdquo;</p>' +
          '<p class="no-results-desc">Check the spelling, or search by full email address.</p>' +
        '</div></div>';
    }
    if (S.results === 'invalid') {
      return '<div class="validation">' +
        '<span class="banner-icon">' + ICON.error + '</span>' +
        '<span class="banner-text">' +
          '<span class="banner-title">Can&#39;t share outside ' + ORG + '</span>' +
          '<span class="banner-desc">' + esc(S.draft.trim()) + ' isn&#39;t in this organization. Share with anyone in ' +
            ORG + ', or ask your admin to add them.</span>' +
        '</span></div>';
    }
    if (S.results !== 'list') return '';

    var found = matches();
    if (!found.length) return '';
    return '<div class="search-results" role="listbox">' + found.map(function (p) {
      var taken = hasAccess(p.id);
      return '<button class="search-result-row' + (taken ? ' taken' : '') + '" role="option" type="button"' +
        (taken ? ' aria-disabled="true"' : ' data-act="pick" data-id="' + p.id + '" data-live="Pick ' + esc(p.name) + '"') + '>' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="person-info"><div class="person-name">' + esc(p.name) + '</div>' +
        '<div class="person-email">' + esc(p.email) + '</div></div>' +
        (taken ? '<span class="has-access-flag">' + ICON.check + '<span>Has access</span></span>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  function renderInputArea() {

    if (S.chips.length) {
      return '<div class="chip-field">' + S.chips.map(function (c) {
        return '<span class="chip">' +
          '<span>' + esc(c.name) + '</span>' +
          '<button class="chip-x" type="button" aria-label="Remove ' + esc(c.name) + '" ' +
            'data-act="unchip" data-id="' + c.id + '" data-live="Remove ' + esc(c.name) + '">' + ICON.smallX + '</button>' +
        '</span>';
      }).join('') +
      '<input class="chip-input" id="addField" type="text" autocomplete="off" ' +
        'placeholder="Add another person" value="' + esc(S.draft) + '" ' +
        'data-live="Add another person">' +
      renderResults() + '</div>';
    }

    return '<div class="search-field">' +
      '<span class="search-icon">' + ICON.search + '</span>' +
      '<input class="search-input" id="addField" type="text" autocomplete="off" ' +
        'placeholder="Add people by name or email" value="' + esc(S.draft) + '" ' +
        'data-live="Add people">' +
      renderResults() +
    '</div>' + renderSuggestions();
  }

  function renderSuggestions() {
    if (!S.suggestions.length) return '';
    // Capped at three &mdash; beyond that they compete with the list below.
    return '<div class="suggest-row">' + S.suggestions.slice(0, 3).map(function (id) {
      var p = DIRECTORY.filter(function (d) { return d.id === id; })[0];
      if (!p || hasAccess(p.id) || isChosen(p.id)) return '';
      return '<button class="suggest-chip" type="button" data-act="pick" data-id="' + p.id + '" ' +
        'data-live="Add ' + esc(p.name) + '"><span class="plus">' + ICON.plus + '</span>' +
        '<span>' + esc(p.name) + '</span></button>';
    }).join('') + '</div>';
  }

  function roleMenu(p, rolesOnly) {
    if (S.roleMenuFor !== p.id) return '';
    var isEditor = p.role === 'editor';
    return '<div class="dd-menu anchored" role="listbox" data-anchor="' + p.id + '">' +
      '<button class="dd-option" role="option" type="button" data-act="role" data-id="' + p.id + '" ' +
        'data-role="editor" data-live="Set Editor">' +
        '<span class="check">' + (isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Editor</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.editor + '</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="role" data-id="' + p.id + '" ' +
        'data-role="viewer" data-live="Set Viewer">' +
        '<span class="check">' + (!isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Viewer</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.viewer + '</span></span></button>' +
      (rolesOnly ? '' :
      '<div class="dd-divider"></div>' +
      (iAmOwner()
        ? '<button class="dd-option" role="option" type="button" data-act="askowner" data-id="' + p.id + '" ' +
            'data-live="Make ' + esc(p.name) + ' owner"><span class="check"></span>' +
            '<span class="dd-option-text"><span class="dd-option-label">Make owner</span></span></button>'
        : '') +
      (p.role === 'editor'
        ? '<button class="dd-option" role="option" type="button" data-act="manage" data-id="' + p.id + '" ' +
            'data-live="Manage access"><span class="check"></span>' +
            '<span class="dd-option-text"><span class="dd-option-label">Manage access</span></span></button>'
        : '') +
      '<button class="dd-option" role="option" type="button" data-act="revoke" data-id="' + p.id + '" ' +
        'data-live="Remove access"><span class="check"></span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Remove access</span></span></button>') +
    '</div>';
  }

  function orgRoleMenu() {
    var isEditor = S.orgRole === 'editor';
    return '<div class="dd-menu" role="listbox">' +
      '<button class="dd-option" role="option" type="button" data-act="orgrole" data-role="editor" ' +
        'data-live="Everyone can edit">' +
        '<span class="check">' + (isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Editor</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.editor + '</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="orgrole" data-role="viewer" ' +
        'data-live="Everyone can view">' +
        '<span class="check">' + (!isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Viewer</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.viewer + '</span></span></button>' +
    '</div>';
  }

  function renderPeople() {
    if (S.peopleError) {
      return '<div class="list-error">' +
        '<span class="list-error-icon">' + ICON.error + '</span>' +
        '<span class="list-error-title">Couldn&#39;t load people</span>' +
        '<span class="list-error-desc">Retry, or contact support.</span>' +
        '<button class="btn btn-secondary" type="button" data-act="reload" data-live="Retry loading people">Retry</button>' +
      '</div>';
    }

    var many = S.people.length >= 6;
    var head = many
      ? '<div class="section-head"><p class="section-label">People with access</p>' +
        '<span class="count-tag">' + S.people.length + ' people</span></div>'
      : '<p class="section-label">People with access</p>';

    var rows = S.people.map(function (p) {
      // "(You)" marks the current user inline after the name, in the same text
      // style — never as a separate trailing label.
      var youMark = p.id === S.me ? ' (You)' : '';
      var trailing;
      if (p.role === 'owner') {
        trailing = '<span class="owner-label">Owner</span>';
      } else {
        trailing = '<div class="dd">' +
          '<button class="dd-trigger' + (S.roleMenuFor === p.id ? ' open' : '') + '" type="button" ' +
            'aria-haspopup="listbox" aria-expanded="' + (S.roleMenuFor === p.id) + '" ' +
            'data-act="rolemenu" data-id="' + p.id + '" data-live="Role for ' + esc(p.name) + '">' +
            '<span>' + (p.role === 'editor' ? 'Editor' : 'Viewer') + '</span>' +
            '<span class="chev">' + (S.roleMenuFor === p.id ? ICON.chevUp : ICON.chev) + '</span></button>' +
          roleMenu(p) + '</div>';
      }
      return '<div class="person-row">' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="person-info"><div class="person-name">' + esc(p.name) + youMark + '</div>' +
        '<div class="person-email">' + esc(p.email) + '</div></div>' +
        trailing + '</div>';
    }).join('');

    return head + '<div class="people-list' + (many ? ' scrolls' : '') + '" id="peopleList">' + rows + '</div>';
  }

  function renderAccess() {
    var icon = S.access === 'restricted' ? ICON.lock : ICON.org;
    var control = '<button class="general-trigger' + (S.accessMenuOpen ? ' open' : '') + '" type="button" ' +
          'aria-haspopup="listbox" aria-expanded="' + S.accessMenuOpen + '" ' +
          'data-act="accessmenu" data-live="General access">' +
          '<span class="general-icon">' + icon + '</span>' +
          '<span>' + accessLabel() + '</span>' +
          '<span class="chev">' + (S.accessMenuOpen ? ICON.chevUp : ICON.chev) + '</span></button>' +
        (S.accessMenuOpen ? accessMenu() : '');

    // The role sits beside the scope, and only when a scope grants access to
    // people who were never listed individually. Restricted grants nobody, so
    // it carries no role.
    var roleControl = '';
    if (S.access === 'org') {
      roleControl = '<div class="dd">' +
            '<button class="dd-trigger' + (S.orgRoleMenuOpen ? ' open' : '') + '" type="button" ' +
              'aria-haspopup="listbox" aria-expanded="' + S.orgRoleMenuOpen + '" ' +
              'data-act="orgrolemenu" data-live="Role for everyone in ' + ORG + '">' +
              '<span>' + orgRoleLabel() + '</span>' +
              '<span class="chev">' + (S.orgRoleMenuOpen ? ICON.chevUp : ICON.chev) + '</span>' +
            '</button>' + (S.orgRoleMenuOpen ? orgRoleMenu() : '') +
          '</div>';
    }

    return '<p class="section-label">General access</p>' +
      '<div class="general-row">' +
        '<div class="general-dd dd">' + control + '</div>' +
        roleControl +
      '</div>' +
      '<p class="general-desc">' + accessDesc() + '</p>';

  function accessMenu() {

      '<button class="dd-option" role="option" type="button" data-act="access" data-value="restricted" ' +

        '<span class="dd-option-text"><span class="dd-option-label">Restricted</span>' +
        '<span class="dd-option-sub">Only the owner and people with access can open the dashboard</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="access" data-value="org" ' +
        'data-live="Set ' + ORG + '"><span class="check">' + (!restricted ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">' + ORG + '</span>' +
        '<span class="dd-option-sub">Anyone in ' + ORG + ' with dashboard access can view</span></span></button>' +
    '</div>';
  }

  function renderFooter() {
    var copy = '<button class="btn btn-secondary' + (S.copied ? ' copied' : '') + '" type="button" ' +
      'data-act="copy" data-live="Copy link">' + (S.copied ? ICON.checkBig : ICON.link) +

    return '<div class="modal-footer">' + copy + primary + '</div>';

  function batchRoleLabel() { return S.batchRole === 'editor' ? 'Editor' : 'Viewer'; }

  function batchRoleMenu() {
    var isEditor = S.batchRole === 'editor';
    return '<div class="dd-menu" role="listbox">' +
      '<button class="dd-option" role="option" type="button" data-act="batchrole" data-role="editor" ' +
        'data-live="Set Editor"><span class="check">' + (isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Editor</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.editor + '</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="batchrole" data-role="viewer" ' +
        'data-live="Set Viewer"><span class="check">' + (!isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Viewer</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.viewer + '</span></span></button>' +
    '</div>';

  function renderCaps() {
    var list = CAPS[S.batchRole] || [];
    if (!list.length) return '';
    var rows = list.map(function (c) {
      var on = c.fixed ? true : S.caps[c.id] !== false;
      return '<label class="cap-row' + (c.fixed ? ' fixed' : '') + '">' +
        '<input type="checkbox" data-cap="' + c.id + '"' + (on ? ' checked' : '') +
          (c.fixed ? ' disabled' : ' data-live="' + esc(c.label) + '"') + '>' +
        '<span class="box">' + (on ? ICON.checkSm : '') + '</span>' +
        '<span class="cap-label">' + c.label + '</span>' +

    }).join('');
    return '<div class="caps"><p class="caps-head">What an editor can do</p>' + rows + '</div>' +
      '<div class="divider"></div>';

  function renderCompose() {
    var banner = S.banner
      ? '<div class="banner"><span class="banner-icon">' + ICON.error + '</span>' +
        '<span class="banner-text"><span class="banner-title">' + S.banner.title + '</span>' +
        '<span class="banner-desc">' + S.banner.desc + '</span></span></div>'
      : '';

    var chips = S.chips.map(function (c) {
      return '<span class="chip"><span>' + esc(c.name) + '</span>' +
        '<button class="chip-x" type="button" aria-label="Remove ' + esc(c.name) + '" ' +
          'data-act="unchip" data-id="' + c.id + '" data-live="Remove ' + esc(c.name) + '">' +
          ICON.smallX + '</button></span>';
    }).join('');

    var primary = S.busy
      ? '<button class="btn btn-primary busy" type="button" aria-busy="true">' +
          '<span class="spin">' + ICON.loader + '</span><span>Sharing&hellip;</span></button>'
      : S.banner
        ? '<button class="btn btn-primary" type="button" data-act="send" data-live="Retry">Retry</button>'
        : '<button class="btn btn-primary" type="button" data-act="send" data-live="Share">Share</button>';

    return '<div class="modal" role="dialog" aria-modal="true" aria-label="Share July sales">' +
      '<div class="modal-header compose">' +

        '<button class="btn btn-secondary" type="button" data-act="copy" data-live="Copy link">' +
          (S.copied ? ICON.checkBig : ICON.link) +

        '<span class="cap-label">' + c.label + '</span>' +

    }).join('');

    return '<div class="modal" role="dialog" aria-modal="true" aria-label="Manage access">' +

      '<div class="person-row">' +
        '<div class="avatar">' + initials(p.name) + '</div>' +

        '<div class="person-email">' + esc(p.email) + '</div></div>' +
        '<div class="dd">' +
          '<button class="dd-trigger' + (S.roleMenuFor === p.id ? ' open' : '') + '" type="button" ' +

            'data-act="rolemenu" data-id="' + p.id + '" data-live="Role for ' + esc(p.name) + '">' +
            '<span>Editor</span>' +

          '</button>' + roleMenu(p, true) + '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="caps"><p class="caps-head">What they can do</p>' + rows + '</div>' +
    '</div>';

  function renderDialog() {
    var banner = S.banner
      ? '<div class="banner"><span class="banner-icon">' + ICON.error + '</span>' +
        '<span class="banner-text"><span class="banner-title">' + S.banner.title + '</span>' +
        '<span class="banner-desc">' + S.banner.desc + '</span></span></div>'
      : '';

      return '<div class="scrim">' + renderManage() + renderToast() + '</div>';

        renderToast() + '</div>';
    }

    return '<div class="scrim">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Share July sales">' +
        '<div class="modal-header">' +
          '<h2 class="modal-title">Share &ldquo;July sales&rdquo;</h2>' +
          '<button class="close-btn" type="button" aria-label="Close" data-act="close" data-live="Close">' +
            ICON.close + '</button>' +
        '</div>' +
        banner +
        renderInputArea() +
        renderPeople() +
        '<div class="divider"></div>' +
        renderAccess() +
        renderFooter() +

      renderToast() +

  // The transfer confirmation: ownership is hard to undo, so it is the one
  // role change that stops to ask.
  function renderConfirmOwner() {
    if (!S.confirmOwner) return '';
    var p = personById(S.confirmOwner);
    if (!p) return '';
    var fn = firstName(p.name);
    return '<div class="scrim confirm-scrim">' +
      '<div class="confirm-card" role="dialog" aria-modal="true" aria-label="Make ' + esc(p.name) + ' owner">' +
        '<h2 class="confirm-title">Make ' + esc(p.name) + ' the owner?</h2>' +
        '<p class="confirm-body">' + esc(fn) + ' will control sharing, general access, and archiving. ' +
          'You&rsquo;ll become an editor, and the new owner can change or remove your access.</p>' +
        '<div class="confirm-actions">' +
          '<button class="btn btn-secondary" type="button" data-act="cancelowner" data-live="Cancel">Cancel</button>' +
          '<button class="btn btn-primary" type="button" data-act="confirmowner" data-id="' + p.id + '" data-live="Make ' + esc(p.name) + ' owner">Make owner</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------
  // Email preview. The other end of the share action: what the chosen
  // person actually receives. Type follows the person's situation.
  // ---------------------------------------------------------------
  function emailType(p) {
    if (p.role === 'owner' && p.gotOwner === 'admin') return 'admin';
    if (p.role === 'owner') return 'transfer';
    return 'share';
  }

  function emailBody(p) {
    var type = emailType(p);
    var fn = firstName(p.name);
    var sharer = 'Vaibhav Bhat';
    var sharerEmail = 'vaibhav.bhat@capillarytech.com';
    var perm = p.role === 'editor' ? 'edit' : 'view';
    // Who sent it, with their address, inline in the sentence; the permission
    // is stated in that sentence and emphasised, the way Drive does it, so
    // there is no doubt what access you got. The card carries app + org.
    var senderBit = esc(sharer) + ' (<span class="em-sender-email">' + esc(sharerEmail) + '</span>)';
    var cardSub = 'App in ' + ORG;

    var heading, invite, cta = 'Open app', footerLine, note = '';

    if (type === 'transfer') {
      heading = sharer + ' made you the owner of &ldquo;July sales&rdquo;';
      invite = senderBit + ' made you the <strong>owner</strong> of this app:';
      footerLine = 'You&rsquo;re receiving this because ' + sharer + ' made you the owner of an app in ' + ORG + '.';
    } else if (type === 'admin') {
      heading = 'You&rsquo;re now the owner of &ldquo;July sales&rdquo;';
      invite = 'Your organisation admin made you the <strong>owner</strong> of this app:';
      footerLine = 'You&rsquo;re receiving this because your organisation admin made you the owner of an app in ' + ORG + ', after the previous owner&rsquo;s account was deactivated.';
    } else {
      heading = sharer + ' shared an app with you';
      invite = senderBit + ' has invited you to <strong>' + perm + '</strong> this app:';
      footerLine = 'You&rsquo;re receiving this because ' + sharer + ' shared an app with you from ' + ORG + '.';
      if (p.message) {
        note = '<div class="em-note">' + esc(p.message) + '</div>';
      }
    }

    return '<div class="em-doc">' +
      '<div class="em-logo">' + ICON.airaWordmark + '</div>' +
      '<p class="em-greet">Hi ' + esc(fn) + ',</p>' +
      '<h1 class="em-heading">' + heading + '</h1>' +
      '<p class="em-invite">' + invite + '</p>' +
      '<div class="em-card">' +
        '<span class="em-card-icon">' + ICON.airaMark + '</span>' +
        '<div class="em-card-text">' +
          '<div class="em-card-name">July sales</div>' +
          '<div class="em-card-sub">' + cardSub + '</div>' +
        '</div>' +
      '</div>' +
      note +
      '<a class="em-cta" href="#" data-act="noop">' + cta + '</a>' +
      '<p class="em-foot">' + footerLine + '<br>&copy; 2026 Capillary Technologies. All rights reserved.</p>' +
    '</div>';
  }

  // A recipient is anyone who'd receive mail: everyone shared with, plus a new
  // owner (transfer or admin). Only the original creator-owner gets nothing.
  function emailRecipients() {
    return S.people.filter(function (p) {
      return p.id !== S.me && (p.role !== 'owner' || p.gotOwner);
    });
  }

  function renderEmailView() {
    var recips = emailRecipients();
    syncEmailSelect(recips);

    if (!recips.length) {
      return '<div class="email-stage">' +
        '<div class="email-empty">' +
          '<span class="email-empty-icon">' + ICON.mailBig + '</span>' +
          '<p class="email-empty-title">No emails yet</p>' +
          '<p class="email-empty-desc">Switch to app sharing, add someone or make them owner, then come back to see what they receive.</p>' +
        '</div>' +
      '</div>';
    }

    var p = personById(S.emailFor);
    if (!p || p.id === S.me) { p = recips[0]; S.emailFor = p.id; }

    var subjectMap = {
      share: 'Vaibhav Bhat shared July sales with you',
      transfer: 'You&rsquo;re now the owner of July sales',
      admin: 'You&rsquo;re now the owner of July sales'
    };

    return '<div class="email-stage">' +
      '<div class="email-client">' +
        '<div class="email-head">' +
          '<div class="email-subject">' + subjectMap[emailType(p)] + '</div>' +
          '<div class="email-meta">' +
            '<span class="email-from-dot">' + ICON.airaMark + '</span>' +
            '<div class="email-meta-text">' +
              '<div class="email-from">aiRA <span class="email-addr">&lt;aira@capillarytech.com&gt;</span></div>' +
              '<div class="email-to">to ' + esc(p.name) + ' <span class="email-addr">&lt;' + esc(p.email) + '&gt;</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="email-scroll">' + emailBody(p) + '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    if (S.mode === 'email') {
      app.innerHTML = renderEmailView() + renderToast();
      return;
    }
    app.innerHTML = renderDashboard() + (S.open ? renderDialog() : '') + renderConfirmOwner();
    restoreScroll();
    positionMenus();
    restoreFocus();
  }

  function positionMenus() {
    var menu = app.querySelector('.dd-menu.anchored');
    if (!menu) return;
    var trigger = app.querySelector('[data-act="rolemenu"][data-id="' + menu.getAttribute('data-anchor') + '"]');
    if (!trigger) return;
    var t = trigger.getBoundingClientRect();
    var h = menu.offsetHeight;
    var below = t.bottom + 4;
    // Flip above the trigger when the menu would run past the viewport.
    var top = (below + h > window.innerHeight - 8) ? Math.max(8, t.top - h - 4) : below;
    menu.style.top = top + 'px';
    menu.style.left = Math.max(8, t.right - menu.offsetWidth) + 'px';
  }

  function restoreScroll() {
    var list = document.getElementById('peopleList');
    if (!list) return;
    S.listScrollTop = Math.max(0, Math.min(S.listScrollTop, list.scrollHeight - list.clientHeight));
    list.scrollTop = S.listScrollTop;
    list.onscroll = function () {
      S.listScrollTop = list.scrollTop;
      positionMenus();
    };
  }

  function restoreFocus() {
    if (!S.inputFocused) return;
    var f = document.getElementById('addField');
    if (!f) { S.inputFocused = false; return; }
    f.focus();
    var pos = Math.min(S.caret, f.value.length);
    try { f.setSelectionRange(pos, pos); } catch (e) { /* not supported on this input type */ }
  }

  // ---------------------------------------------------------------
  // Interactions. Every one ends in a single render, via act().
  // ---------------------------------------------------------------
  // An actionable toast dwells longer than a plain confirmation: 4s is tight
  // when the undo is the only way back from a destructive action.
  function showToast(text, withUndo) {
    if (timers.toast) clearTimeout(timers.toast);
    S.toast = { text: text, undo: !!withUndo };
    timers.toast = setTimeout(function () {
      timers.toast = null;
      S.toast = null;
      S.undo = null;
      render();
    }, withUndo ? 6000 : 4000);
  }

  function clearToast() {
    if (timers.toast) { clearTimeout(timers.toast); timers.toast = null; }
    S.toast = null;
  }

  function renderToast() {
    if (!S.toast) return '';
    return '<div class="toast" role="status">' +
      '<span>' + esc(S.toast.text) + '</span>' +
      (S.toast.undo
        ? '<button class="toast-undo" type="button" data-act="undo" data-live="Undo">Undo</button>'
        : '') +
    '</div>';
  }

  function openMenusClosed() {
    S.roleMenuFor = null;
    S.accessMenuOpen = false;
    S.orgRoleMenuOpen = false;
    S.batchRoleMenuOpen = false;
  }

  function anyMenuOpen() {
    return !!(S.roleMenuFor || S.accessMenuOpen || S.orgRoleMenuOpen || S.batchRoleMenuOpen);
  }

  function addChip(id) {
    var p = DIRECTORY.filter(function (d) { return d.id === id; })[0];
    if (!p || isChosen(id) || hasAccess(id)) return;
    S.chips.push({ id: p.id, name: p.name, email: p.email });
    S.draft = '';
    S.caret = 0;
    S.results = 'closed';
    // Picking someone is what opens the compose step, as in Drive.
    S.view = 'compose';
    // Keep the caret in the field: the next thing you do is usually add
    // another person, and focus must never fall back to the body.
    S.inputFocused = true;
  }

  function runShare() {
    if (!S.chips.length) return;
    S.banner = null;
    S.busy = true;
    render();
    timers.share = setTimeout(function () {
      timers.share = null;
      S.busy = false;

      if (S.failNext) {
        S.failNext = false;
        S.banner = {
          title: 'Couldn&#39;t share this dashboard',
          desc: 'Retry, or contact support.'
        };
        render();
        return;
      }

      if (S.partialNext && S.chips.length) {
        S.partialNext = false;
        var failing = S.chips[S.chips.length - 1];
        var landed = S.chips.slice(0, -1);
        landed.forEach(function (c) { S.people.push(person(c.id, c.name, c.email, 'viewer')); });
        S.chips = [failing];
        S.view = 'compose';
        S.banner = {
          title: 'Shared with ' + landed.length + ' of ' + (landed.length + 1) + ' people',
          desc: esc(failing.name) + '&#39;s account is deactivated. Remove them, or ask your admin to reactivate it.'
        };
        render();
        return;
      }

      var n = S.chips.length;
      var role = S.batchRole;
      var caps = { edit: S.caps.edit, rename: S.caps.rename, share: S.caps.share };
      var notify = S.notify;
      var msg = S.message;
      S.chips.forEach(function (c) {
        var np = person(c.id, c.name, c.email, role, role === 'editor' ? caps : allCaps());
        np.notify = notify;
        np.message = msg;
        S.people.push(np);
      });
      S.chips = [];
      S.shared = true;
      S.message = '';
      S.view = 'picker';
      // The next batch starts from the safe default again.
      S.batchRole = 'viewer';
      S.caps = allCaps();
      showToast('Shared with ' + n + (n === 1 ? ' person' : ' people'), false);
      render();
    }, 1300);
  }

  function typed(value, caret) {
    S.draft = value;
    S.caret = caret;
    S.inputFocused = true;
    if (timers.load) { clearTimeout(timers.load); timers.load = null; }

    if (!S.draft.trim()) {
      S.results = 'closed';
      render();
      return;
    }
    if (looksExternal()) {
      S.results = 'invalid';
      render();
      return;
    }
    S.results = 'loading';
    render();
    timers.load = setTimeout(function () {
      timers.load = null;
      var found = matches();
      S.results = found.length ? 'list' : 'none';
      if (!found.length) {
        render();
      } else {
        render();
      }
    }, 420);
  }

  var MENU_TOGGLES = { rolemenu: 1, accessmenu: 1, orgrolemenu: 1, batchrolemenu: 1 };

  function act(el) {
    var a = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (!MENU_TOGGLES[a]) openMenusClosed();

    if (a === 'open') { S.open = true; render(); return; }
    if (a === 'close') { S.open = false; openMenusClosed(); render(); return; }

    if (a === 'pick') { addChip(id); render(); return; }
    if (a === 'unchip') {
      S.chips = S.chips.filter(function (c) { return c.id !== id; });
      if (!S.chips.length) { S.view = 'picker'; S.banner = null; }
      render();
      return;
    }
    if (a === 'share' || a === 'send') { runShare(); return; }
    if (a === 'manage') {
      S.manageFor = id;
      S.roleMenuFor = null;
      S.view = 'manage';
      render();
      return;
    }
    if (a === 'back' && S.view === 'manage') {
      // Changes applied as they were ticked, so this is just the way back.
      S.view = 'picker';
      S.manageFor = null;
      render();
      return;
    }
    if (a === 'back' || a === 'cancel') {
      // Both drop the pending recipients, as in Drive: a pending batch only
      // exists inside compose.
      S.chips = [];
      S.draft = '';
      S.results = 'closed';
      S.banner = null;
      S.message = '';
      S.batchRoleMenuOpen = false;
      S.batchRole = 'viewer';
      S.caps = allCaps();
      S.view = 'picker';
      S.manageFor = null;
      render();
      return;
    }
    if (a === 'batchrolemenu') {
      S.batchRoleMenuOpen = !S.batchRoleMenuOpen;
      render();
      return;
    }
    if (a === 'batchrole') {
      S.batchRole = el.getAttribute('data-role');
      S.batchRoleMenuOpen = false;
      render();
      return;
    }

    if (a === 'rolemenu') {
      S.roleMenuFor = S.roleMenuFor === id ? null : id;
      S.accessMenuOpen = false;
      render();
      return;
    }
    if (a === 'role') {
      var role = el.getAttribute('data-role');
      S.people.forEach(function (p) { if (p.id === id) p.role = role; });
      S.roleMenuFor = null;
      if (S.view === 'manage' && role === 'viewer') {
        // A viewer has nothing to manage, so there is no view left to be in.
        S.view = 'picker';
        S.manageFor = null;
      }
      render();
      return;
    }
    if (a === 'askowner') {
      S.confirmOwner = id;
      render();
      return;
    }
    if (a === 'cancelowner') {
      S.confirmOwner = null;
      render();
      return;
    }
    if (a === 'confirmowner') {
      var target = personById(id);
      var cur = ownerPerson();
      // Single owner: the seat moves. The old owner steps down to editor.
      if (cur && cur.id !== id) { cur.role = 'editor'; cur.caps = allCaps(); cur.gotOwner = null; }
      if (target) { target.role = 'owner'; target.caps = allCaps(); target.gotOwner = 'transfer'; }
      S.confirmOwner = null;
      if (target) showToast(target.name + ' is now the owner', false);
      render();
      return;
    }
    if (a === 'noop') { return; }

    if (a === 'revoke') {
      var idx = -1, removed = null;
      S.people.forEach(function (p, i) { if (p.id === id) { idx = i; removed = p; } });
      if (!removed) return;
      S.people.splice(idx, 1);
      S.roleMenuFor = null;
      S.undo = { person: removed, index: idx };
      showToast('Removed ' + removed.name, true);
      render();
      return;
    }
    if (a === 'undo') {
      if (S.undo) {
        S.people.splice(S.undo.index, 0, S.undo.person);
        S.undo = null;
      }
      clearToast();
      render();
      return;
    }

    if (a === 'accessmenu') {
      S.accessMenuOpen = !S.accessMenuOpen;
      S.roleMenuFor = null;
      S.orgRoleMenuOpen = false;
      render();
      return;
    }
    if (a === 'orgrolemenu') {
      S.orgRoleMenuOpen = !S.orgRoleMenuOpen;
      S.roleMenuFor = null;
      S.accessMenuOpen = false;
      render();
      return;
    }
    if (a === 'orgrole') {
      S.orgRole = el.getAttribute('data-role');
      S.orgRoleMenuOpen = false;
      render();
      return;
    }
    if (a === 'access') {
      S.access = el.getAttribute('data-value');
      S.accessMenuOpen = false;
      render();
      return;
    }

    if (a === 'copy') {
      S.copied = true;
      if (timers.copy) clearTimeout(timers.copy);
      timers.copy = setTimeout(function () { timers.copy = null; S.copied = false; render(); }, 1600);
      render();
      return;
    }

    if (a === 'reload') { S.peopleError = false; S.people = baseline(); render(); return; }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el) {
      if (el.tagName === 'A') e.preventDefault();
      act(el);
      return;
    }
    var field = e.target.closest('.chip-field, .search-field');
    if (field) {
      var input = field.querySelector('#addField');
      if (input) { S.inputFocused = true; input.focus(); return; }
    }
    // Clicking outside an open menu closes it, as the real dropdown does.
    if (anyMenuOpen() && !e.target.closest('.dd-menu, .general-menu')) {
      openMenusClosed();
      render();
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'message') { S.message = e.target.value; return; }
    if (e.target.id !== 'addField') return;
    typed(e.target.value, e.target.selectionStart || e.target.value.length);
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'notify') { S.notify = e.target.checked; render(); return; }
    var cap = e.target.getAttribute && e.target.getAttribute('data-cap');
    if (cap) { S.caps[cap] = e.target.checked; render(); return; }
    var mcap = e.target.getAttribute && e.target.getAttribute('data-managecap');
    if (mcap) {
      S.people.forEach(function (p) { if (p.id === S.manageFor) p.caps[mcap] = e.target.checked; });
      render();
    }
  });
  app.addEventListener('focusin', function (e) {
    if (e.target.id === 'addField') S.inputFocused = true;
  });

  // ---------------------------------------------------------------
  // Steps. Each apply() fully specifies the state.
  // ---------------------------------------------------------------
  function reset() {
    clearTimers();
    S.open = true;
    S.view = 'picker';
    S.people = baseline();
    S.batchRole = 'viewer';
    S.batchRoleMenuOpen = false;
    S.caps = allCaps();
    S.manageFor = null;
    S.notify = true;
    S.message = '';
    S.peopleError = false;
    S.draft = '';
    S.caret = 0;
    S.inputFocused = false;
    S.results = 'closed';
    S.suggestions = [];
    S.chips = [];
    S.roleMenuFor = null;
    S.accessMenuOpen = false;
    S.access = 'restricted';
    S.orgRole = 'viewer';
    S.orgRoleMenuOpen = false;
    S.busy = false;
    S.banner = null;
    S.toast = null;
    S.copied = false;
    S.undo = null;
    S.shared = false;
    S.listScrollTop = 0;
    S.me = 'owner';
    // Failure arming now belongs to the scenario, so each scenario fully
    // specifies it: clear here, the failure scenarios set it after.
    S.failNext = false;
    S.partialNext = false;
  }

  // ---------------------------------------------------------------
  // Scenarios. Only the states you cannot reach by clicking the
  // product: a different role, a dataset size, a failure to arm.
  // Everything else is reached the way a real user would reach it.
  // ---------------------------------------------------------------
  function seed(id, role) {
    var d = DIRECTORY.filter(function (x) { return x.id === id; })[0];
    return person(d.id, d.name, d.email, role);
  }

  var SCENARIOS = [
    { id: 'default', name: 'Only you', apply: function () { reset(); } },
    { id: 'shared', name: 'Shared with someone', apply: function () {
        reset(); S.people.push(existingEditor());
      } },
    { id: 'suggested', name: 'Suggested people', apply: function () {
        reset(); S.suggestions = ['punya', 'rakshit', 'tara'];
      } },
    { id: 'nine', name: 'Nine people', apply: function () {
        reset();
        S.people.push(existingEditor());
        ['mehul', 'rakshit', 'punya', 'pavan', 'dev', 'sana', 'tara'].forEach(function (id) {
          S.people.push(seed(id, 'viewer'));
        });
      } },
    { id: 'loaderror', name: "People won't load", apply: function () {
        reset(); S.peopleError = true;
      } },
    { id: 'sharefail', name: 'Share will fail', apply: function () {
        reset(); S.failNext = true;
      } },
    { id: 'sharepartial', name: 'Share partly fails', apply: function () {
        reset(); S.partialNext = true;
      } },
    { id: 'reassigned', name: 'Owner left — admin reassigned', apply: function () {
        reset();
        // The original owner's account is gone; an admin has made Punya owner.
        S.people = [
          person('punya', 'Punya Shetty', 'punya.shetty@capillarytech.com', 'owner'),
          existingEditor(),
          seed('tara', 'viewer')
        ];
        S.people[0].gotOwner = 'admin';
        S.me = 'owner'; // the departed original owner, absent from the list
      } }
  ];

  var scenarioSel = document.getElementById('scenario');

  function scenarioById(id) {
    return SCENARIOS.filter(function (x) { return x.id === id; })[0];
  }

  function goScenario(id, fromHash) {
    var sc = scenarioById(id) || SCENARIOS[0];
    sc.apply();
    scenarioSel.value = sc.id;
    if (!fromHash && location.hash.replace('#', '') !== sc.id) {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', '#' + sc.id);
      }
    }
    render();
  }

  scenarioSel.innerHTML = SCENARIOS.map(function (sc) {
    return '<option value="' + sc.id + '">' + esc(sc.name) + '</option>';
  }).join('');
  scenarioSel.onchange = function () { goScenario(scenarioSel.value); };

  // View toggle: app sharing vs. the email a chosen person receives.
  var viewModeSel = document.getElementById('viewMode');
  var emailForSel = document.getElementById('emailFor');

  function syncEmailSelect(recips) {
    if (!emailForSel) return;
    var html = recips.map(function (p) {
      var t = emailType(p);
      var suffix = t === 'share' ? (p.role === 'editor' ? ' — editor' : ' — viewer') : ' — owner';
      return '<option value="' + p.id + '">' + esc(p.name + suffix) + '</option>';
    }).join('');
    if (emailForSel.innerHTML !== html) emailForSel.innerHTML = html;
    var has = recips.some(function (p) { return p.id === S.emailFor; });
    emailForSel.value = has ? S.emailFor : (recips[0] ? recips[0].id : '');
  }

  viewModeSel.onchange = function () {
    S.mode = viewModeSel.value;
    document.body.classList.toggle('email-mode', S.mode === 'email');
    render();
  };
  emailForSel.onchange = function () { S.emailFor = emailForSel.value; render(); };

  document.getElementById('btnRestart').onclick = function () { goScenario(scenarioSel.value); };

  window.addEventListener('resize', positionMenus);
  window.addEventListener('hashchange', function () {
    var id = location.hash.replace('#', '');
    if (scenarioById(id)) goScenario(id, true);
  });

  goScenario(location.hash.replace('#', '') || 'default', true);
})();
</script>
